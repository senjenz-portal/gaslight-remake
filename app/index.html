<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaslight Remake — Ch. 1, Beat I</title>
<style>
  /* ------------------------------------------------------------------ *
   * The page is a DARK LEAF: assets/plates/page-texture.png stretched
   * across the whole viewport and crushed to near-black in the backdrop
   * shader, with the diorama sitting in a lit inset panel. Prose is cream
   * serif ink in the leaf's margin — edgeless, no boxes, no chrome.
   * [R6-3] Contrast of the LIVE line, measured off the lap's screenshots at both
   * ratios (see .blk.past below): 14.27–15.69:1, where AA needs 4.5. Two earlier
   * comments guessed at this number — 11.7:1 here and 9.6:1 in scene.js — and no
   * measurement had ever been taken; this one is the ink and the ground, diffed.
   * System serif only: no external fonts, no runtime network.
   * ------------------------------------------------------------------ */
  :root{
    --cream:#eee4cc;
    --cream-bright:#f6edd6;
    --gold:#d6c49e;
    --gold-dim:rgba(205,171,99,.55);
    --navy:#05070f;
    --marginw:32vw;
    --insetx:36vw;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--navy);
    -webkit-font-smoothing:antialiased;}
  body{font-family:var(--serif);color:var(--cream);}

  /* the WebGL surface fills the viewport; the page ground AND the inset
     panel are drawn IN GL (see scene.js makeBackdrop) so a screenshot never
     depends on CSS compositing order. */
  #gl{position:fixed;inset:0;display:block;width:100%;height:100%;}

  /* ---- the margin column ------------------------------------------- */
  #margin{
    position:fixed;left:0;top:0;bottom:0;width:var(--marginw);
    box-sizing:border-box;padding:6vh 2.2vw 20vh 3.4vw;
    display:flex;flex-direction:column;justify-content:center;
    pointer-events:none;z-index:5;
    background:linear-gradient(90deg,rgba(4,3,2,.34) 0%,rgba(4,3,2,.18) 62%,rgba(4,3,2,0) 100%);
  }
  #blocks{display:flex;flex-direction:column;gap:14px;}
  .blk{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease;}
  .blk.in{opacity:1;transform:none;}
  /* [R6-5] The receded lines are READ, not decoration — a reader who looks up
     from the picture picks the thread back up in them — so they answer to WCAG
     AA like any other body text, and at .34 they did not: MEASURED on round 5's
     own page, the receded body ran 2.51–2.71:1 and the receded speaker label
     2.03–2.13:1, against a 4.5 line. At .62 the same measurement gives
        receded body  5.79–6.41:1     receded label 5.12–5.42:1
        live body   14.27–15.69:1     live label  12.78–13.09:1
     so the live line still leads the brightest receded one by 1.99x — the
     recession keeps doing its job, it just no longer does it by going illegible.
     Every number here is measured off the lap's own screenshots, both ratios,
     at 04-i-04-note2 and 24-i-24-both: the frame is shot twice, once with
     `visibility:hidden` on the type, and the pixels that differ are the ink and
     the ground under it (review-lap inkOf / contrast probe). */
  .blk.past{opacity:.62;}
  /* [R6-5] The label was authored DIMMER than the line it labels
     (rgba(224,206,168,.94)) and set 6 px smaller with .19em of tracking, so it
     was the first thing the recession took below AA and the last thing a
     recession lever could rescue: measured on round 5's page it read 2.03–2.13:1
     receded and 9.67–10.02:1 live, a full step under the body in both states. A
     label has no business being harder to read than its own speech, so it is the
     same warm cream at full alpha now — one hue step off the body's #eee4cc,
     which is all the hierarchy a 6 px and .19em difference needs. Measured:
     5.12–5.42:1 receded, 12.78–13.09:1 live. */
  .blk .who{display:block;font-variant:small-caps;letter-spacing:.19em;font-size:12.5px;
    color:#eee0c0;margin-bottom:5px;}
  .blk p{margin:0;color:var(--cream);font-size:clamp(16px,1.30vw,21px);line-height:1.52;
    text-shadow:0 1px 5px rgba(0,0,0,.98);}
  .blk.doc p{border-left:1px solid var(--gold-dim);padding-left:13px;font-style:italic;
    color:var(--cream-bright);}
  .blk.head{text-align:left;}
  .blk.head .rule{width:52px;height:1px;background:var(--gold-dim);margin-bottom:16px;}
  .blk.head .num{font-variant:small-caps;letter-spacing:.26em;font-size:13px;
    color:rgba(214,182,110,.96);margin-bottom:9px;}
  .blk.head p{font-size:clamp(26px,2.9vw,42px);line-height:1.08;color:#f4ecd7;
    letter-spacing:.02em;}
  .blk p .drop{float:left;font-size:2.9em;line-height:.82;padding:.05em .1em 0 0;
    color:#f4ecd7;}

  /* the affordance is type in the same margin, never a button */
  #cue{margin-top:20px;padding-top:11px;border-top:1px solid rgba(205,171,99,.28);
    font-variant:small-caps;letter-spacing:.2em;font-size:13px;color:#f5dfa6;
    opacity:0;transition:opacity .4s ease;}
  #cue.on{opacity:.98;}
  #cue .beat{display:inline-block;animation:breathe 2.6s ease-in-out infinite;}
  #cue.nudge{animation:nudge .5s ease-out 1;}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes nudge{0%{transform:translateX(0)}22%{transform:translateX(7px)}
    52%{transform:translateX(-5px)}100%{transform:translateX(0)}}

  /* progress: beat + unit, always visible (no wedge states) */
  #prog{position:fixed;right:20px;bottom:16px;z-index:7;pointer-events:none;
    font-variant:small-caps;letter-spacing:.2em;font-size:12px;
    color:rgba(226,208,170,.82);text-shadow:0 1px 3px rgba(0,0,0,.95);}

  /* First-visit affordance hint — fades for good after the first click.
     ROUND-1 [v7]: this used to fade by animating `color` to alpha 0. A
     text-shadow is painted from the GLYPH, not from the text colour, so an
     invisible-but-present hint left its drop shadow behind as a dark band
     across the foot of the inset in every later frame. Fading OPACITY takes
     the shadow with it, and visibility is delayed off the transition so the
     element stops compositing entirely once the fade completes. */
  #hint{position:fixed;left:0;right:0;bottom:5.5vh;z-index:7;text-align:center;
    pointer-events:none;font-variant:small-caps;letter-spacing:.24em;font-size:13px;
    color:rgba(245,223,166,.92);text-shadow:0 1px 6px rgba(0,0,0,.95);
    opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s;}
  #hint.on{opacity:1;visibility:visible;transition:opacity .6s ease,visibility 0s;}

  /* ---- the hold ring: stands ON the thing, not in the margin -------- */
  #hold,#target{position:fixed;left:0;top:0;width:78px;height:78px;margin:-39px 0 0 -39px;
    z-index:6;pointer-events:none;opacity:0;transition:opacity .35s ease;}
  #hold.on,#target.on{opacity:1;}
  #hold svg,#target svg{width:100%;height:100%;}
  #hold svg{transform:rotate(-90deg);}
  #hold .trk,#target .trk{fill:none;stroke:rgba(214,196,158,.20);stroke-width:2;}
  #hold .arc{fill:none;stroke:#f0d79a;stroke-width:2.6;stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(240,215,154,.55));}
  #hold .dot,#target .dot{fill:rgba(240,215,154,.9);}
  #target .ring{fill:none;stroke:#7fe3d8;stroke-width:2.2;
    filter:drop-shadow(0 0 7px rgba(127,227,216,.65));}
  #target .ring2{fill:none;stroke:rgba(127,227,216,.5);stroke-width:1.2;}
  #target.miss .ring{stroke:#f0b07a;}

  /* ---- the leader line: type -> the speaker's head ------------------ */
  /* width/height are NOT optional: <svg> is a replaced element, so
     `inset:0` alone leaves it at the 300x150 intrinsic default and every
     leader path (drawn in viewport px) is clipped away off its right edge.
     This is why the leader never appeared before round 1. */
  #leader{position:fixed;inset:0;width:100%;height:100%;z-index:4;
    pointer-events:none;opacity:0;transition:opacity .35s ease;}
  #leader.on{opacity:.72;}
  #leader path{fill:none;stroke:rgba(226,208,170,.65);stroke-width:1;}
  #leader circle{fill:rgba(226,208,170,.85);}

  /* ---- the cameo card: identity, lower-left ------------------------- */
  #cameo{position:fixed;left:3.0vw;bottom:3.2vh;z-index:7;width:132px;
    pointer-events:none;opacity:0;transform:translateY(10px);
    transition:opacity .45s ease,transform .45s ease;}
  #cameo.on{opacity:1;transform:none;}
  #cameo .frame{width:132px;height:150px;border-radius:66px 66px 58px 58px;
    overflow:hidden;position:relative;
    background:linear-gradient(180deg,#141a2c 0%,#080b16 100%);
    box-shadow:0 4px 18px rgba(0,0,0,.6),inset 0 0 0 1px rgba(205,171,99,.42);}
  #cameo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:50% 34%;}
  #cameo.noart img{display:none;}
  #cameo .mono{position:absolute;inset:0;display:none;align-items:center;
    justify-content:center;font-size:54px;color:rgba(226,208,170,.5);}
  #cameo.noart .mono{display:flex;}
  #cameo .cap{margin-top:9px;font-variant:small-caps;letter-spacing:.14em;
    font-size:11.5px;line-height:1.35;color:rgba(230,214,178,.96);
    text-shadow:0 1px 4px rgba(0,0,0,.95);}
  #cameo.flip .frame{animation:flip .62s ease-in-out 1;}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}
    100%{transform:rotateY(0)}}

  /* ---- page-turn cover + the closing card --------------------------- */
  #cover{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;
    background:radial-gradient(120% 100% at 50% 50%,#0a1020 0%,#01030a 72%);}
  #endcard{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:14px;}
  #endcard .rule{width:88px;height:1px;background:var(--gold-dim);}
  #endcard .kick{font-variant:small-caps;letter-spacing:.34em;font-size:13px;
    color:rgba(214,182,110,.96);}
  #endcard .ttl{font-size:clamp(28px,3.4vw,46px);color:#f4ecd7;letter-spacing:.02em;}
  #endcard .sub{font-variant:small-caps;letter-spacing:.22em;font-size:12.5px;
    color:rgba(226,208,170,.78);}

  /* ---- harness mode -------------------------------------------------
     The moment __setTime() latches the sim clock, every wall-clock-driven
     CSS transition/animation is killed. Without this a screenshot taken
     right after a step could catch type mid-fade, and two identical laps
     would not produce identical pixels. Sim time drives the picture; CSS
     is only allowed to drive the *live* reader's eye. */
  html.harness *,
  html.harness *::before,
  html.harness *::after { transition:none !important; animation:none !important; }
  html.harness .blk { opacity:1; transform:none; }
  html.harness .blk.past { opacity:.62; }     /* [R6-5] the same value, measured */

  /* ---- portrait / iPad: the margin moves to the foot of the page ----
     ROUND-1 [V2]: the column used to be a fixed 41vh block bottom-aligned
     with 8vh of padding under it, which left ~24% of the leaf empty between
     the picture and the first line — two islands. It is now TOP-anchored to
     --margintop, the exact pixel row where the inset ends (main.js layout()
     writes it), so the prose starts one leading under the plate. */
  @media (max-aspect-ratio: 9/10){
    #margin{left:0;right:0;top:var(--margintop,63vh);bottom:0;width:auto;height:auto;
      padding:14px 6vw 2.4vh calc(4.2vw + 104px);justify-content:flex-start;
      background:linear-gradient(0deg,rgba(4,3,2,.46) 0%,rgba(4,3,2,.22) 70%,rgba(4,3,2,0) 100%);}
    #blocks{gap:11px;}
    .blk p{font-size:clamp(16px,2.15vw,22px);line-height:1.46;}
    .blk.head p{font-size:clamp(26px,4.6vw,40px);}
    .blk .who{font-size:11.5px;margin-bottom:4px;}
    #cue{margin-top:13px;padding-top:9px;}
    #prog{bottom:auto;top:14px;right:18px;}
    #hint{bottom:2.4vh;top:auto;}
    /* the cameo takes the foot of the leaf's left margin; the prose is
       inset past it so identity and speech never collide */
    #cameo{left:4.2vw;right:auto;bottom:2.0vh;top:auto;width:92px;}
    #cameo .frame{width:92px;height:106px;border-radius:46px 46px 38px 38px;}
    #cameo .cap{font-size:10.5px;letter-spacing:.1em;}
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>
<body>
  <canvas id="gl"></canvas>

  <svg id="leader"><path d=""></path><circle cx="-99" cy="-99" r="2.4"></circle></svg>

  <div id="margin"><div id="blocks"></div><div id="cue"><span class="beat"></span></div></div>

  <div id="cameo">
    <div class="frame"><img alt=""><div class="mono"></div></div>
    <div class="cap"></div>
  </div>

  <div id="hold">
    <svg viewBox="0 0 78 78">
      <circle class="trk" cx="39" cy="39" r="33"></circle>
      <circle class="arc" cx="39" cy="39" r="33" stroke-dasharray="207.35" stroke-dashoffset="207.35"></circle>
      <circle class="dot" cx="39" cy="39" r="2.2"></circle>
    </svg>
  </div>

  <div id="target">
    <svg viewBox="0 0 78 78">
      <circle class="ring2" cx="39" cy="39" r="33"></circle>
      <circle class="ring" cx="39" cy="39" r="22"></circle>
      <circle class="dot" cx="39" cy="39" r="2.4"></circle>
    </svg>
  </div>

  <div id="hint"></div>
  <div id="prog"></div>
  <div id="cover"></div>
  <div id="endcard">
    <div class="rule"></div>
    <div class="kick"></div>
    <div class="ttl"></div>
    <div class="sub"></div>
    <div class="rule"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
